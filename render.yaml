services:
  - type: web
    name: recomendador-explicable
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT --chdir app app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.10"
      - key: PYTHONUNBUFFERED
        value: "1"